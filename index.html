<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#25063f" />
  <meta name="description" content="Todas las redes sociales oficiales de la fanbase RanyBang GTO en un solo lugar." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="RanyBang GTO | Encuéntranos" />
  <meta property="og:description" content="¡Únete a la comunidad ARMY de RanyBang! Instagram, TikTok, Facebook y X." />
  <meta property="og:image" content="assets/ranybang-logo.webp" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <title>RanyBang GTO | Nuestras redes</title>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="glow glow-a"></div><div class="glow glow-b"></div>
    <span class="star star-1">✦</span><span class="star star-2">✧</span>
    <span class="star star-3">✦</span><span class="star star-4">✧</span>
  </div>
  <main class="container">
    <div class="eyebrow"><span class="live-dot"></span> TU ESPACIO ARMY EN GUANAJUATO</div>
    <header class="hero">
      <img class="logo" src="assets/ranybang-logo.webp" width="280" height="280" alt="Logo de RanyBang con ranita, luces moradas y referencias a BTS" />
      <h1 id="nombre">RanyBang GTO</h1>
      <p class="subtitle" id="subtitulo">Fanbase ARMY 💜 Guanajuato</p>
      <p class="message" id="mensaje">¡Conecta con nuestra comunidad! Encuentra todas nuestras redes sociales en un solo lugar.</p>
    </header>
    <section aria-labelledby="redes-titulo">
      <div class="section-heading"><h2 id="redes-titulo">Síguenos en redes</h2><span>↘</span></div>
      <div id="redes" class="links"></div>
    </section>
    <div class="share-wrap"><button id="compartir" class="share-button" type="button">♡ Compartir esta página</button><p id="aviso" class="notice" role="status" aria-live="polite"></p></div>
    <footer><span class="footer-heart">♥</span><span id="pie">Hecho con 💜 para la comunidad ARMY</span></footer>
  </main>
</body>
</html>
